name: Implement approved board ticket with Codex

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  repository-projects: write

concurrency:
  group: codex-board-ticket
  cancel-in-progress: false

env:
  PROJECT_TITLE: ''
  STATUS_FIELD: Status
  AI_FIELD: AI-Bearbeitung
  AI_APPROVED_OPTION: Freigegeben

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Find an approved draft ticket in Backlog
        id: board
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PROJECT_TITLE: ${{ env.PROJECT_TITLE }}
          STATUS_FIELD: ${{ env.STATUS_FIELD }}
          AI_FIELD: ${{ env.AI_FIELD }}
          AI_APPROVED_OPTION: ${{ env.AI_APPROVED_OPTION }}
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY#*/}"
          query='query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){projectsV2(first:20){nodes{id title fields(first:50){nodes{... on ProjectV2SingleSelectField{id name options{id name}}}} items(first:100){nodes{id content{__typename ... on DraftIssue{id title body}} fieldValues(first:50){nodes{... on ProjectV2ItemFieldSingleSelectValue{name field{... on ProjectV2SingleSelectField{name}}}}}}}}}}}'
          gh api graphql -f query="$query" -f owner="$owner" -f repo="$repo" > /tmp/projects.json

          if jq -e --arg title "$PROJECT_TITLE" --arg status_field "$STATUS_FIELD" --arg ai_field "$AI_FIELD" --arg approved "$AI_APPROVED_OPTION" '
            first(
              .data.repository.projectsV2.nodes[]
              | select(($title == "") or .title == $title)
              | . as $project
              | ($project.fields.nodes[] | select(.name == $status_field)) as $status
              | ($project.fields.nodes[] | select(.name == $ai_field)) as $ai
              | ($project.items.nodes[]
                | select(.content.__typename == "DraftIssue")
                | . as $item
                | ([ $item.fieldValues.nodes[] | select(.field.name == $status_field) | .name ][0] // "") as $current_status
                | ([ $item.fieldValues.nodes[] | select(.field.name == $ai_field) | .name ][0] // "") as $ai_status
                | select($current_status == "Backlog" and $ai_status == $approved)
                | {project_id:$project.id,item_id:$item.id,status_field_id:$status.id,status_options:$status.options,content_id:$item.content.id,title:$item.content.title,body:($item.content.body // ""),project_title:$project.title}
              )
          ' /tmp/projects.json > /tmp/board.json; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
            cat /tmp/board.json
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'No approved draft ticket in Backlog found.'
          fi

      - name: Move ticket to In Arbeit
        if: steps.board.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          option_id=$(jq -r '.status_options[] | select(.name == "In Arbeit") | .id' /tmp/board.json)
          test -n "$option_id" && test "$option_id" != "null"
          mutation='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}){projectV2Item{id}}}'
          gh api graphql -f query="$mutation" -f project="$(jq -r .project_id /tmp/board.json)" -f item="$(jq -r .item_id /tmp/board.json)" -f field="$(jq -r .status_field_id /tmp/board.json)" -f option="$option_id" >/dev/null

      - name: Checkout main
        if: steps.board.outputs.eligible == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare ticket context
        if: steps.board.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          title=$(jq -r .title /tmp/board.json)
          body=$(jq -r .body /tmp/board.json)
          {
            printf '# Board ticket: %s\n\n' "$title"
            printf '%s\n' "$body"
          } > .codex-ticket.md
          cp .github/codex/implement-issue.md .codex-prompt.md
          {
            printf '\n\n## Board ticket context\n'
            cat .codex-ticket.md
            printf '\n\nThis is a GitHub Project draft ticket, not a GitHub Issue. Do not expect an issue number or issue comments.\n'
          } >> .codex-prompt.md

      - name: Run Codex
        if: steps.board.outputs.eligible == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: .codex-prompt.md
          output-file: .codex-final-message.md

      - name: Create feature branch and pull request
        id: pull_request
        if: steps.board.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          title=$(jq -r .title /tmp/board.json)
          slug=$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-50)
          branch="codex/ticket-${slug:-draft}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          rm -f .codex-ticket.md .codex-prompt.md .codex-final-message.md
          git add -A
          git commit -m "Implement board ticket: $title"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --set-upstream origin "$branch"
          pr_url=$(gh pr create --repo "$REPOSITORY" --base main --head "$branch" --title "Implement: $title" --body "Automated implementation of the approved Project ticket **$title**. Please review the diff and CI results before merging.")
          printf 'url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"

      - name: Move ticket to Fertig
        if: steps.board.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          option_id=$(jq -r '.status_options[] | select(.name == "Fertig") | .id' /tmp/board.json)
          test -n "$option_id" && test "$option_id" != "null"
          mutation='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}){projectV2Item{id}}}'
          gh api graphql -f query="$mutation" -f project="$(jq -r .project_id /tmp/board.json)" -f item="$(jq -r .item_id /tmp/board.json)" -f field="$(jq -r .status_field_id /tmp/board.json)" -f option="$option_id" >/dev/null

      - name: Write workflow summary
        if: steps.board.outputs.eligible == 'true'
        env:
          PR_URL: ${{ steps.pull_request.outputs.url }}
        run: |
          {
            echo '## Codex-Agent'
            echo
            echo "Ticket: **$(jq -r .title /tmp/board.json)**"
            echo
            echo "Status: **Fertig**"
            echo
            echo "Pull Request: $PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write failure summary
        if: ${{ failure() && steps.board.outputs.eligible == 'true' }}
        run: |
          {
            echo '## Codex-Agent fehlgeschlagen'
            echo
            echo "Ticket: **$(jq -r .title /tmp/board.json)**"
            echo
            echo 'Das Ticket bleibt auf **In Arbeit**. Bitte den Workflow-Lauf prüfen.'
          } >> "$GITHUB_STEP_SUMMARY"
